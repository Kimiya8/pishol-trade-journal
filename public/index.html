<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pishol Trade Journal</title>
    <link rel="stylesheet" href="../src/styles/main.css" />
</head>
<body>
    <div id="app">
        <h1>Pishol Trade Journal</h1>
        <div id="trade-form">
            <input id="pair" placeholder="Symbol (e.g. EURUSD)" />
            <input id="direction" placeholder="Direction (Buy/Sell)" />
            <input id="entry" placeholder="Entry Price" />
            <input id="exit" placeholder="Exit Price" />
            <button id="save">Save Trade</button>
        </div>
        <div id="trades"></div>
    </div>
    <script src="../src/app.js"></script>
</body>
</html>
